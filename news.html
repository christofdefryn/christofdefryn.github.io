<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'">
    <title>News Archive | Prof. dr. Christof Defryn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

{% include nav.html prefix="" %}

<div class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <a href="index.html#news">News</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Archive</span>
</div>

<!-- NEWS ARCHIVE -->
<section id="news-archive">
    <div class="container">
        <div class="section-header">
            <p class="section-label">News Archive</p>
            <h2 class="section-title">All Updates</h2>
            <div class="section-divider"></div>
        </div>
        <div class="news-list" id="newsArchiveList"></div>
    </div>
</section>

{% include footer.html prefix="" %}

<script src="utils.js"></script>
<script src="news-data.js"></script>
<script src="news.js"></script>
<script>
    const toggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    toggle.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', () => navLinks.classList.remove('open')));

    loadNews('newsArchiveList', { emptyMessage: 'No news items yet — check back soon.' });
</script>
</body>
</html>
